<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membership Login — Development Challenges Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>
<body class="fit-screen flex min-h-screen flex-col">

  <header class="shrink-0 border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-14 w-full max-w-4xl items-center gap-4 px-5">
      <a href="index.html" class="font-display text-lg font-bold text-brand-950 no-underline">Membership Login</a>
      <nav class="ml-auto flex items-center gap-1 text-sm" aria-label="Main">
        <a href="index.html" class="rounded-full px-4 py-1.5 font-medium text-slate-600 hover:bg-slate-100">Home</a>
        <a href="membership-consent.html" class="rounded-full px-4 py-1.5 font-medium text-slate-600 hover:bg-slate-100">Register</a>
      </nav>
    </div>
  </header>

  <main id="main" class="fit-main mx-auto flex w-full max-w-4xl flex-1 flex-col items-center justify-start px-4 pt-4 pb-4">
    <div id="login-alert" role="alert" hidden class="fixed top-16 left-1/2 z-50 w-[min(92vw,480px)] -translate-x-1/2 rounded-lg border border-red-200 bg-red-50 px-4 py-2.5 text-sm text-red-800 shadow-lg"></div>

    <!-- Login -->
    <section id="login-view" class="card lg-form w-full max-w-xl px-7 py-9 shadow-lg shadow-brand-950/5 sm:px-10" aria-label="Membership login">

      <!-- Backend: set action to your login endpoint and add data-submit="server" -->
      <form id="login-form" action="/login" method="post" novalidate>
        <div class="fld">
          <label for="member-id" class="label">Member ID</label>
          <input id="member-id" name="member_id" class="input" placeholder="Member ID or email" autocomplete="username" autofocus>
          <span class="err" id="member-id-err"></span>
        </div>
        <div class="fld">
          <label for="password" class="label">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" class="input pr-10" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" id="toggle-pw" aria-label="Show password" class="absolute top-1/2 right-1 -translate-y-1/2 cursor-pointer rounded-md p-1.5 text-slate-500 hover:bg-slate-100"></button>
          </div>
          <span class="err" id="password-err"></span>
        </div>
        <div class="mb-6 flex flex-wrap items-center justify-between gap-2 text-[15px]">
          <label class="flex cursor-pointer items-center gap-2 text-slate-700"><input type="checkbox" name="remember" class="size-4 accent-brand-700"> Remember me</label>
          <button type="button" id="show-reset" class="cursor-pointer font-medium text-brand-700 hover:underline">Forgotten password?</button>
        </div>
        <button type="submit" class="btn btn-primary w-full py-3 text-base">Login</button>
      </form>

      <p class="mt-6 text-center text-[15px] text-slate-600">Don't have an account? <a href="membership-consent.html" class="font-medium text-brand-700 hover:underline">Register</a></p>
    </section>

    <!-- Forgotten password -->
    <section id="reset-view" hidden class="card lg-form w-full max-w-xl px-7 py-9 shadow-lg shadow-brand-950/5 sm:px-10" aria-labelledby="reset-title">
      <h1 id="reset-title" class="mb-1 text-xl font-bold text-brand-950">Reset your password</h1>
      <p class="mb-5 text-sm text-slate-500">Enter the email linked to your account and we'll send you a reset link.</p>
      <div id="reset-ok" role="status" hidden class="mb-4 rounded-lg border border-green-200 bg-green-50 px-4 py-2.5 text-sm text-green-800"></div>
      <!-- Backend: set action to your reset endpoint and add data-submit="server" -->
      <form id="reset-form" action="/forgot-password" method="post" novalidate>
        <div class="fld">
          <label for="reset-email" class="label">Email address</label>
          <input id="reset-email" name="email" type="email" class="input" placeholder="name@example.com" autocomplete="email">
          <span class="err" id="reset-email-err"></span>
        </div>
        <button type="submit" class="btn btn-primary w-full py-3 text-base">Send reset link</button>
      </form>
      <p class="mt-5 text-center text-sm"><button type="button" id="back-login" class="cursor-pointer font-medium text-brand-700 hover:underline">← Back to login</button></p>
    </section>
  </main>

  <footer class="shrink-0 bg-brand-950 text-sm text-blue-100">
    <div class="mx-auto flex w-full max-w-4xl flex-wrap items-center justify-between gap-4 px-5 py-3">
      <span>© 2026 Development Challenges Community</span>
      <nav class="flex gap-5" aria-label="Legal">
        <a href="privacy.html" class="font-semibold text-white underline decoration-blue-400 underline-offset-4">Privacy Policy (POPIA)</a>
        <a href="terms.html" class="font-semibold text-white underline decoration-blue-400 underline-offset-4">Terms</a>
      </nav>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
