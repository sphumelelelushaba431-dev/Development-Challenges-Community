<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard — Development Challenges Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>
<body class="dash-fit">
  <a href="#content" class="sr-only z-[100] rounded-md bg-brand-800 px-3 py-2 text-sm font-semibold text-white focus:not-sr-only focus:fixed focus:top-3 focus:left-3">Skip to main content</a>
  <div class="min-h-screen">
    <div class="dash-col flex min-w-0 flex-col">
      <header class="sticky top-0 z-30 flex h-16 shrink-0 items-center gap-4 bg-white px-5 lg:px-6">
        <h1 id="page-title" class="min-w-0 truncate font-display text-[22px] font-bold text-brand-950"></h1>
        <label class="relative ml-auto hidden w-80 md:block"><span class="sr-only">Search</span>
          <input id="search" class="input border-transparent bg-slate-100 py-2.5 shadow-none" placeholder="Search challenges..."></label>
        <button id="bell" aria-label="Notifications" class="relative inline-flex size-10 cursor-pointer items-center justify-center rounded-full text-slate-600 hover:bg-slate-100 max-md:ml-auto">
          <svg class="size-5.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="bell-count" class="absolute top-1.5 right-2 size-2 rounded-full bg-red-500 ring-2 ring-white"></span></button>
        <button id="top-avatar" aria-label="Your profile" aria-haspopup="dialog" aria-expanded="false" class="flex size-10 cursor-pointer items-center justify-center rounded-full bg-brand-100 text-[14px] font-bold text-brand-700 ring-brand-300 hover:ring-2 focus-visible:ring-2"></button>
      </header>
      <main id="content" tabindex="-1" class="dash-main focus:outline-none flex w-full flex-col gap-4 bg-slate-50 px-5 pt-4 pb-5 lg:px-6"></main>
    </div>
  </div>
  <div id="toast" role="status" class="pointer-events-none fixed right-5 bottom-5 z-[80] max-w-sm translate-y-2 rounded-lg bg-brand-950 px-4 py-3 text-sm text-white opacity-0 shadow-xl transition"></div>
  <div id="modal-root"></div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
